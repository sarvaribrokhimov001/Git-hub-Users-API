<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Git Hub Users API </title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg" type="image/svg+xml"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav>
        <div class="navbar">
            <i class="ri-github-fill navbar__icon"></i>
            <h4 class="navbar__title"> GitHub Finder </h4>
        </div> <!-- navbar -->
    </nav>


    <main>
        <div class="intro">
            <h2 class="intro__title"> GitHub User Finder </h2>
            <div class="intro__main">
                <div class="intro__search__and__icon">
                   <i class="ri-search-line intro__icon"></i>
                   <input class="intro__search__input" type="search" placeholder="Search....">
                </div> <!-- intro__search__icon --> 
              <button class="intro__btn"> Search </button>
            </div> <!-- intro__main -->
        </div> <!-- intro -->
    </main>


    <section>
        <div class="cards">
            <h2 class="loading" style="display:none;"> Loading.... </h2>
        </div> <!-- cards -->
    </section>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="index.js"></script>
</body>
</html>
